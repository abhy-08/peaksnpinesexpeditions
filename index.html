<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peaks 'N' Pines Expeditions | Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --slate-bg: #090d16;
      --arctic-blue: #38bdf8;
      --arctic-glow: rgba(56, 189, 248, 0.2);
      --text-light: #f1f5f9;
      --text-muted: #94a3b8;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--slate-bg);
      color: var(--text-light);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(to bottom, rgba(9, 13, 22, 0.85), rgba(9, 13, 22, 0.95)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      padding: 20px;
    }
    .welcome-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 50px 30px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--arctic-blue);
      margin-bottom: 20px;
      box-shadow: 0 0 20px var(--arctic-glow);
    }
    .tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--arctic-blue);
      font-weight: 600;
      margin-bottom: 12px;
      background: var(--arctic-glow);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.2rem, 4vw, 2.8rem);
      line-height: 1.15;
      color: var(--white);
      margin-bottom: 14px;
      font-weight: 600;
    }
    h1 span {
      color: var(--arctic-blue);
    }
    p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--arctic-blue);
      color: var(--slate-bg);
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s ease;
      width: 100%;
    }
    .btn-enter:hover {
      transform: translateY(-2px);
    }
    .footer-note {
      margin-top: 25px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <img src="logo.PNG" alt="Peaks 'N' Pines Logo" class="brand-logo">
    <span class="brand-title" style="display:none;">Peaks 'N' Pines</span>
    <span class="tag">Established Expeditions</span>
    <h1>Travel, <span>elevated.</span></h1>
    <p>Step into a world of curated group journeys, breathtaking mountain getaways, and seamless road experiences.</p>
    
    <a href="home.html" class="btn-enter">Enter Portal &rarr;</a>
    
    <div class="footer-note">
      Peaks 'N' Pines Expeditions • Designed by abhy
    </div>
  </div>

</body>
</html>
